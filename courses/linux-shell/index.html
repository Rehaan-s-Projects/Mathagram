    <p>Master the Linux command line — files, permissions, processes, pipes, Bash scripting, text tools, networking, package management, systemd, and automation. 181 lessons across 12 units.</p>
  </header>

  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,'Foundations',['Why Linux','What Is a Shell?','Linux Distributions','Opening a Terminal','The Prompt Explained','Your First Commands','Command Syntax','Getting Help — man & --help','tldr Pages','The Filesystem Hierarchy','Absolute vs Relative Paths','Online Linux Sandboxes','Bash vs Zsh vs Fish','Reading Errors','Foundations Checkpoint']],
      [2,'Navigating the Filesystem',['pwd','ls','ls Options','cd','Home & Tilde','Hidden Files','tree','Path Shortcuts — . .. -','file Command','stat','Tab Completion','Wildcards & Globbing','Brace Expansion','Quoting Paths with Spaces','Navigation Checkpoint']],
      [3,'Working with Files',['touch','mkdir','cp','mv','rm','rm -r & Safety','Renaming Files','Copying Directories','Creating Nested Directories','rmdir','ln — Hard Links','ln -s — Symbolic Links','Comparing Files — diff','Wildcards in File Ops','Files Checkpoint']],
      [4,'Viewing & Editing Text',['cat','less & more','head & tail','tail -f','nano','vim Basics','vim Modes','Saving & Quitting vim','Emacs Basics','echo','printf','wc — Counting','Viewing Large Files','Editor Choice','Text Viewing Checkpoint']],
      [5,'Permissions & Ownership',['Users & Groups','Reading ls -l','File Permission Bits','chmod — Symbolic','chmod — Octal','chown','chgrp','The root User','sudo','su','umask','Special Bits — setuid setgid sticky','Access Control Lists','Permission Troubleshooting','Permissions Checkpoint']],
      [6,'Pipes & Redirection',['Standard Input Output Error','Output Redirection >','Appending >>','Input Redirection <','Redirecting stderr 2>','Combining Streams','Pipes |','tee','/dev/null','Here Documents','Here Strings','Command Substitution','xargs','Building Pipelines','Pipes Checkpoint']],
      [7,'Searching & Finding',['grep','grep Options','Recursive grep','grep with Regex','find — by Name','find — by Type & Size','find — by Time','find -exec','locate','which & whereis','type','fzf — Fuzzy Finder','ripgrep','Searching Strategies','Searching Checkpoint']],
      [8,'Text Processing',['cut','sort','uniq','tr','paste','join','column','comm','rev','fold','nl — Numbering','Combining Text Tools','Text Pipeline Patterns','Common Recipes','Text Processing Checkpoint']],
      [9,'sed & awk',['What Is sed?','sed Substitution','sed Addressing','sed Delete & Print','sed In-Place Editing','What Is awk?','awk Fields','awk Patterns','awk Actions','awk Built-in Variables','awk Arithmetic','awk Conditionals & Loops','sed vs awk vs grep','Real-World One-Liners','sed & awk Checkpoint']],
      [10,'Processes',['What Is a Process?','ps','top & htop','Process IDs','Foreground vs Background','Jobs — jobs fg bg','Suspending with Ctrl-Z','kill','Signals','killall & pkill','nice & renice','nohup','Daemons','Process Trees — pstree','Processes Checkpoint']],
      [11,'The Bash Environment',['Environment Variables','echo $VAR','export','PATH','Shell vs Environment Variables','.bashrc & .bash_profile','Aliases','Functions in the Shell','Prompt Customization — PS1','History','History Expansion','Shell Options — set & shopt','Login vs Non-Login Shells','Dotfiles','Environment Checkpoint']],
      [12,'Shell Scripting Basics',['Your First Script','The Shebang','Making Scripts Executable','Running Scripts','Comments','Variables in Scripts','Reading Input — read','Positional Parameters','Special Parameters — $@ $# $?','Quoting Rules','Command Substitution in Scripts','Exit Codes','Debugging — set -x','Script Style','Scripting Basics Checkpoint','The if Statement']]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'sh-'+n, title: t, href: '#', unit: u, unitName: name, category: 'programming', checkpoint: i===titles.length-1 });
    if (lessons[0]) lessons[0].href = 'lesson-1.html';
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('linux-shell');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('linux-shell');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
