  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Skateboarding</h1>
    <p>Street, park, and vert skating — pushing, ollies, kickflips, grinds, manuals, and dropping in on transition. 7 units, 36 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Board Setup",["Decks & Concave","Trucks","Wheels & Bearings","Grip Tape","Setting Up a Board","Board Checkpoint"]],
      [2,"Stance & Pushing",["Regular vs Goofy","Pushing Foot","Mongo (avoid)","Cruising","Stance Checkpoint"]],
      [3,"Foundational Tricks",["Tic-Tac","Manual","Nose Manual","Kickturn","Foundational Checkpoint"]],
      [4,"The Ollie",["Pop & Slide","Front Foot Drag","Ollie Over Cracks","Higher Ollies","Ollie Checkpoint"]],
      [5,"Flip Tricks",["Kickflip","Heelflip","Pop Shove-It","360 Flip","Flip Checkpoint"]],
      [6,"Grinds & Slides",["50-50","Boardslide","5-0","Crooked Grind","Grinds Checkpoint"]],
      [7,"Transition",["Rolling In","Pumping","Kickturn on Quarter","Dropping In","Transition Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'skateboarding-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('skateboarding');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('skateboarding');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
</body>
