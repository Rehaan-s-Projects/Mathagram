  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Plumbing Basics</h1>
    <p>Residential plumbing — copper, PEX, PVC; soldering, crimping, gluing; drain & vent design; fixing leaks, replacing faucets, unclogging drains. 7 units, 36 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Pipe Materials",["Copper","PEX","CPVC","PVC & ABS","Galvanized (legacy)","Materials Checkpoint"]],
      [2,"Tools",["Pipe Wrench","Tubing Cutter","Pex Crimper","Plumber's Tape","Snake & Auger","Tools Checkpoint"]],
      [3,"Soldering Copper",["Cleaning Pipe & Fitting","Flux","Heating Joint","Feeding Solder","Solder Checkpoint"]],
      [4,"PEX Connections",["Crimp vs Cinch","Push-Fit (SharkBite)","Manifold Layout","PEX Checkpoint"]],
      [5,"Drain, Waste, Vent",["DWV Pipe Sizing","Trap Arms","Venting Rules","Slope (1/4\" per ft)","DWV Checkpoint"]],
      [6,"Fixing Leaks",["Compression Fittings","Sweat Repair","Slip Joints","Pinhole Leaks","Leaks Checkpoint"]],
      [7,"Common Repairs",["Replace a Faucet","Replace a Toilet","Unclog a Drain","Sweat a New Valve","Repairs Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'plumbingbasics-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('plumbing-basics');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('plumbing-basics');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
