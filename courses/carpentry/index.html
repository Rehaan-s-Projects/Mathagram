  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Carpentry</h1>
    <p>Rough & finish carpentry — measuring, framing, stairs, doors, trim, cabinet hanging, deck building, and joinery. 7 units, 36 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Tools",["Hammer & Nail Sets","Speed Square","Tape Measure","Circular Saw","Miter Saw","Tools Checkpoint"]],
      [2,"Measuring & Marking",["Reading a Tape","Speed Square Angles","Plumb, Level, Square","Story Pole","Measuring Checkpoint"]],
      [3,"Framing",["Wall Layout","Stud Spacing 16\" OC","Headers & Sills","Top & Bottom Plates","Framing Checkpoint"]],
      [4,"Joinery",["Butt Joint","Pocket Hole","Mortise & Tenon","Dovetail","Joinery Checkpoint"]],
      [5,"Stairs",["Stringer Layout","Rise & Run Math","Treads & Risers","Newel Posts","Stairs Checkpoint"]],
      [6,"Trim & Doors",["Baseboard Miter Returns","Door Hanging","Door Casing","Crown Molding","Trim Checkpoint"]],
      [7,"Decks",["Footings","Ledger Boards","Joists & Spans","Composite vs Wood","Decks Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'carpentry-'+n, title: t, href: 'quiz.html?unit='+u+'&lesson='+(i+1), unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('carpentry');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('carpentry');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
