  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Stage Magic</h1>
    <p>Card tricks, coin magic, mentalism, and large-stage illusions — sleights, misdirection, presentation, scripting, and ethics of magic. 7 units, 34 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Magician's Code",["Don't Repeat a Trick","Never Reveal the Method","Practice in Front of a Mirror","Magic Code Checkpoint"]],
      [2,"Card Magic",["Hindu Shuffle","False Cut","Double Lift","Glide","Force","Cards Checkpoint"]],
      [3,"Coin Magic",["Classic Palm","Finger Palm","French Drop","Coin Bend","Coins Checkpoint"]],
      [4,"Mentalism",["Center Tear","Cold Reading","Memorized Decks","Multiple Outs","Mentalism Checkpoint"]],
      [5,"Sleight of Hand",["Misdirection","Timing","Patter","Sleights Checkpoint"]],
      [6,"Large Illusions",["Vanishing Cabinet","Sawing in Half","Levitation","Substitution Trunk","Illusions Checkpoint"]],
      [7,"Performance",["Stage Presence","Scripting","Music & Lighting","Theme Shows","Performance Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'stagemagic-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('stage-magic');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('stage-magic');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
