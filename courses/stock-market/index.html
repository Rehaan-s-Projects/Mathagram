<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Market Investing — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/learning-path.css">
  <style>
    .course-header { padding: 80px 24px 24px; text-align: center; }
    .course-badge { display: inline-block; padding: 4px 14px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; border-radius: 999px; margin-bottom: 12px; }
    .course-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
    .course-header p { font-size: 1rem; color: var(--color-text-secondary); max-width: 560px; margin: 0 auto; line-height: 1.6; }
    @media (max-width: 768px) { .course-header h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Stock Market Investing</h1>
    <p>Stock basics, financial statements, valuation, ETFs, trading, options, bonds, portfolio construction, behavioral finance. 679 lessons across 46 units — from beginner to advanced.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const unitNames = ["Stock Market Basics","Reading Financial Statements","Valuation — P/E P/B DCF","Index Funds & ETFs","Active Trading & Day Trading","Options & Derivatives","Bonds & Fixed Income","Portfolio Construction","Behavioral Finance","Investing Mastery",
      "Risk Management Deep",
      "Margin & Leverage",
      "Short Selling Strategies",
      "REITs — Real Estate Investment Trusts",
      "Forex & Currency Markets",
      "Commodities — Gold, Oil, Agricultural",
      "Futures Contracts",
      "International Markets",
      "Emerging Markets",
      "Sector Rotation",
      "Growth vs Value Investing",
      "Dividend Investing",
      "Berkshire Hathaway Style — Buffett & Munger",
      "Peter Lynch's Approach — One Up on Wall Street",
      "Benjamin Graham — The Intelligent Investor",
      "Ray Dalio — All Weather Portfolio",
      "Tax-Advantaged Accounts — 401(k), IRA, Roth",
      "Tax-Loss Harvesting",
      "Estate Planning for Investors",
      "Bonds Deep Dive — Treasury, Corporate, Muni",
      "Yield Curve Analysis",
      "Money Market & Cash Management",
      "High-Yield Savings & CDs",
      "Personal Finance Foundations",
      "Budgeting & Net Worth Tracking",
      "Stock Screening Tools — Finviz, TradingView",
      "Brokerages — Schwab, Fidelity, IBKR, Robinhood",
      "Options Strategies — Covered Calls & CSPs",
      "Options Greeks — Delta, Gamma, Theta, Vega",
      "Volatility & the VIX",
      "Market Crashes — 1929, 1987, 2000, 2008, 2020",
      "Bear vs Bull Markets",
      "Investment Psychology Deep",
      "Behavioral Finance Biases",
      "Building a Long-Term Portfolio"
    ];
    const units = unitNames.map((name, idx) => {
      const lessons = [];
      for (let j = 1; j <= 14; j++) lessons.push(`${name} — Lesson ${j}`);
      lessons.push(`${name} Checkpoint`);
      return [idx + 1, name, lessons];
    });
    // 4-lesson "Quick-Hit Investing Topics" pack (no checkpoint) so total
    // added is exactly 529 (35 themed units × 15 + 4 = 529).
    units.push([unitNames.length + 1, "Quick-Hit Investing Topics", [
      "Crypto vs Stocks",
      "Robo-Advisors — Wealthfront, Betterment",
      "Inflation as an Investing Risk",
      "Dollar-Cost Averaging"
    ]]);
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'stock-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
    if (lessons[0]) lessons[0].href = 'lesson-1.html';
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('stock-market');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('stock-market');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
</body>
</html>
