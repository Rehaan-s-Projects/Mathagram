  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Voice Acting</h1>
    <p>Animation, video games, commercials, and audiobooks — voice care, accents, character voices, ADR, mic technique, and home-studio setup. 7 units, 37 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Voice Foundations",["Vocal Anatomy","Breath Support","Resonance","Articulation","Voice Care","Foundations Checkpoint"]],
      [2,"Mic Technique",["Proximity Effect","Pop Filters","Plosive Control","Mic Placement","Mic Checkpoint"]],
      [3,"Home Studio",["Acoustic Treatment","DAW Choice","USB vs XLR Mics","Audio Interface","Studio Checkpoint"]],
      [4,"Character Voices",["Pitch Variation","Speed Variation","Vocal Placement","Aging Characters","Character Checkpoint"]],
      [5,"Accents",["IPA Basics for Actors","American Regional","British Variants","Avoiding Stereotypes","Accents Checkpoint"]],
      [6,"Genres",["Animation","Video Games","Commercials","Audiobooks","ADR","Genres Checkpoint"]],
      [7,"Business",["Demo Reel","Agents & Casting","Auditioning Tips","Rates & Royalties","Business Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'voiceacting-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('voice-acting');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('voice-acting');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
