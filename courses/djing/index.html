  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>DJing</h1>
    <p>Beatmatching, mixing, scratching, and producing — turntables vs CDJs vs controllers, EQing, harmonic mixing, and reading the dance floor. 7 units, 35 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Gear",["Turntables","CDJs","Controllers (Pioneer, Native Instruments)","Mixers","Headphones","Gear Checkpoint"]],
      [2,"Beatmatching",["Counting Bars (32-Bar Phrasing)","Cueing the Next Track","Pitch Faders","Tempo Lock","Beatmatching Checkpoint"]],
      [3,"Mixing",["Crossfader vs Channel Faders","EQ Mixing","Filters","Looping","Mixing Checkpoint"]],
      [4,"Harmonic Mixing",["Camelot Wheel","Key Detection","Pitch Shifting Trade-offs","Harmonic Checkpoint"]],
      [5,"Effects & Sampling",["Delay","Reverb","Echo Out","Cue Points & Hot Cues","Effects Checkpoint"]],
      [6,"Scratching",["Baby Scratch","Stab","Chirp","Crab","Scratching Checkpoint"]],
      [7,"Reading the Floor",["Genre Mixing","Energy Curves","Crowd Cues","Set Pacing","Floor Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'djing-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('djing');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('djing');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
