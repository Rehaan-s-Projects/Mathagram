  <header class="course-header">
    <span class="course-badge" style="background:var(--color-programming)">Programming</span>
    <h1>CAD & 3D Modeling</h1>
    <p>Parametric and freeform CAD — Fusion 360, SolidWorks, FreeCAD basics; sketches, extrudes, lofts, assemblies, drawings, and 3D-print prep. 7 units, 37 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"CAD Foundations",["Sketches & Constraints","Parametric vs Direct","Reference Planes","Datum Geometry","Foundations Checkpoint"]],
      [2,"Sketching",["Lines, Arcs, Circles","Dimensioning","Constraints (Coincident, Tangent)","Construction Geometry","Sketching Checkpoint"]],
      [3,"Features",["Extrude","Revolve","Sweep","Loft","Shell","Fillet & Chamfer","Features Checkpoint"]],
      [4,"Assemblies",["Mate Constraints","Sub-Assemblies","Exploded Views","Interference Check","Assemblies Checkpoint"]],
      [5,"Drawings",["Standard Views","Section Views","Dimensioning Best Practices","GD&T Basics","Drawings Checkpoint"]],
      [6,"3D Printing Prep",["Export STL","Slicer Settings","Supports","Orientation for Strength","3D Print Checkpoint"]],
      [7,"Software Tour",["Fusion 360","SolidWorks","FreeCAD","OnShape","Software Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'cad3dmodeling-'+n, title: t, href: 'quiz.html?unit=' + u + '&lesson=' + (i + 1), unit: u, unitName: name, category: 'programming', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('cad-3d-modeling');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('cad-3d-modeling');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
