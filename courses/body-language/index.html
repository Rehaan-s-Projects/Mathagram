  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Body Language</h1>
    <p>Read and use nonverbal communication — microexpressions, posture, gestures, eye contact, proxemics, and cultural differences. 7 units, 33 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Foundations",["What Is Body Language?","Conscious vs Unconscious Signals","Baseline Behavior","Cultural Variation","Foundations Checkpoint"]],
      [2,"Facial Expressions",["The 7 Universal Emotions","Microexpressions","Genuine vs Fake Smiles","Eye Contact","Facial Checkpoint"]],
      [3,"Posture & Space",["Open vs Closed Posture","Power Poses","Proxemics (Personal Space)","Mirroring","Posture Checkpoint"]],
      [4,"Gestures",["Emblems","Illustrators","Adaptors","Hand-to-Face","Gestures Checkpoint"]],
      [5,"Detecting Deception",["Comfort vs Discomfort","Verbal-Nonverbal Mismatches","The Myth of Eye Direction","Deception Checkpoint"]],
      [6,"Communication Settings",["Job Interviews","Public Speaking","Dating","Negotiation","Settings Checkpoint"]],
      [7,"Cultural Body Language",["Greetings Around the World","Bow vs Handshake vs Hug","Taboo Gestures","Cultural Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'bodylanguage-'+n, title: t, href: 'quiz.html?unit=' + u + '&lesson=' + (i + 1), unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('body-language');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('body-language');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
