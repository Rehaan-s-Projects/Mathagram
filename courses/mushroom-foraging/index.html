<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushroom Foraging — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/learning-path.css">
  <style>
    .course-header { padding: 80px 24px 24px; text-align: center; }
    .course-badge { display: inline-block; padding: 4px 14px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; border-radius: 999px; margin-bottom: 12px; }
    .course-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
    .course-header p { font-size: 1rem; color: var(--color-text-secondary); max-width: 620px; margin: 0 auto; line-height: 1.6; }
    @media (max-width: 768px) { .course-header h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-science)">Science</span>
    <h1>Mushroom Foraging</h1>
    <p>Wild mushroom identification — edible vs deadly lookalikes, spore prints, habitats, seasonal calendars, and ethical foraging. 7 units, 40 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Foraging Safety",["The Rule: Never Eat Without 100% ID","Spore Prints","The Universal Veil","Always Cook Wild Mushrooms","Allergic Reactions","Safety Checkpoint"]],
      [2,"Habitats",["Oak Woodlands","Conifer Forests","Mixed Hardwood","Meadows","Burn Sites","Habitats Checkpoint"]],
      [3,"Edible Choice Species",["Morels","Chanterelles","Black Trumpet","Hen of the Woods","Chicken of the Woods","Lobster Mushroom","Edibles Checkpoint"]],
      [4,"Deadly Lookalikes",["Death Cap (Amanita phalloides)","Destroying Angel","False Morel","Galerina","Toxic Lookalikes Checkpoint"]],
      [5,"Tools & Gear",["Mesh Bag","Knife","Field Guide","GPS / Map","Camera","Gear Checkpoint"]],
      [6,"Identification Drills",["Cap Shape","Gills vs Pores vs Teeth","Stem Features","Color Changes on Cut","ID Drills Checkpoint"]],
      [7,"Cooking & Preserving",["Cleaning Fresh Mushrooms","Sautéing","Drying","Pickling","Cooking Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'mushroomforaging-'+n, title: t, href: '#', unit: u, unitName: name, category: 'science', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('mushroom-foraging');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('mushroom-foraging');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
</body>
</html>
