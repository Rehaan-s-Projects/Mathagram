  <header class="course-header">
    <span class="course-badge" style="background:var(--color-programming)">Programming</span>
    <h1>Linux Server Admin</h1>
    <p>Ubuntu, Debian, RHEL, and Arch server administration — systemd, networking, firewalls, SSH hardening, package management, and shell scripting at scale. 7 units, 35 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Distros",["Debian / Ubuntu","RHEL / Rocky / Alma","Arch / Manjaro","Alpine","Distros Checkpoint"]],
      [2,"Package Management",["APT","DNF / YUM","Pacman","Snap & Flatpak","Packages Checkpoint"]],
      [3,"systemd",["Units & Services","Targets","Timers vs Cron","Journalctl","systemd Checkpoint"]],
      [4,"Networking",["IP Addressing","NetworkManager","systemd-networkd","DNS Resolution","Networking Checkpoint"]],
      [5,"Firewalls",["ufw","firewalld","iptables","nftables","Firewall Checkpoint"]],
      [6,"SSH Hardening",["Key Auth Only","Fail2Ban","Port Knocking","SSH Tunnels","SSH Checkpoint"]],
      [7,"Backups & Cron",["rsync","Snapshots (BTRFS/ZFS)","Cron Syntax","Anacron","Backups Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'linuxserveradmin-'+n, title: t, href: '#', unit: u, unitName: name, category: 'programming', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('linux-server-admin');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('linux-server-admin');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
