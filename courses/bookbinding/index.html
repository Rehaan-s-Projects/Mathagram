<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookbinding — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/learning-path.css">
  <style>
    .course-header { padding: 80px 24px 24px; text-align: center; }
    .course-badge { display: inline-block; padding: 4px 14px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; border-radius: 999px; margin-bottom: 12px; }
    .course-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
    .course-header p { font-size: 1rem; color: var(--color-text-secondary); max-width: 620px; margin: 0 auto; line-height: 1.6; }
    @media (max-width: 768px) { .course-header h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Bookbinding</h1>
    <p>Hand bookbinding — Coptic stitch, Japanese stab binding, perfect binding, case binding, leather covers, headbands, and restoring antique books. 7 units, 35 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Paper & Materials",["Paper Grain Direction","Endpapers","Boards (Davey, Chipboard)","Cloth & Buckram","Glues (PVA vs Wheat)","Materials Checkpoint"]],
      [2,"Folding & Folio",["Signatures","Folding a Folio","Quarto, Octavo, Sixteenmo","Punching Sewing Stations","Folio Checkpoint"]],
      [3,"Coptic Stitch",["Single-Needle Coptic","Chain Stitch","Adding Boards","Two-Needle Variant","Coptic Checkpoint"]],
      [4,"Japanese Stab Binding",["Four-Hole Pattern","Tortoise Shell","Hemp Leaf","Yotsume Toji","Stab Binding Checkpoint"]],
      [5,"Perfect Binding",["Gluing the Spine","Reinforcing","Wrap-Around Cover","Perfect Binding Checkpoint"]],
      [6,"Case Binding",["Hard Case Construction","Casing-In","Adding Endpapers","Headbands","Case Binding Checkpoint"]],
      [7,"Restoration",["Cleaning Old Books","Repairing Tears","Rebacking","Conservation Ethics","Restoration Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'bookbinding-'+n, title: t, href: 'quiz.html?unit=' + u + '&lesson=' + (i + 1), unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('bookbinding');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('bookbinding');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
</body>
</html>
