  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Auto Mechanics</h1>
    <p>Engine, drivetrain, brakes, suspension, and electrical systems — oil changes, brake jobs, timing belts, OBD-II diagnostics, and basic troubleshooting. 7 units, 36 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Engine Basics",["Four-Stroke Cycle","Cylinder Layouts (I4, V6, V8)","Compression Ratio","Valvetrain","Engine Checkpoint"]],
      [2,"Routine Maintenance",["Oil & Filter Change","Air Filter","Cabin Filter","Spark Plugs","Coolant Flush","Maintenance Checkpoint"]],
      [3,"Brakes",["Pad Replacement","Rotor Inspection","Caliper Service","Brake Fluid Bleed","Brakes Checkpoint"]],
      [4,"Suspension & Steering",["Struts vs Shocks","Ball Joints","Tie Rod Ends","Wheel Alignment","Suspension Checkpoint"]],
      [5,"Electrical",["Battery & Alternator","Starter","Fuses & Relays","OBD-II Codes","Electrical Checkpoint"]],
      [6,"Drivetrain",["Transmission Types","Differential","CV Axles","Clutch","Drivetrain Checkpoint"]],
      [7,"Diagnostics",["Reading Scan Tools","Smoke Color from Exhaust","Listening for Knocks","Vibration Diagnosis","Diagnostics Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'automechanics-'+n, title: t, href: 'quiz.html?unit=' + u + '&lesson=' + (i + 1), unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('auto-mechanics');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('auto-mechanics');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
