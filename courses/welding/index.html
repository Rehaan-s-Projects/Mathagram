  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Welding</h1>
    <p>Stick (SMAW), MIG, TIG, and oxy-fuel welding — joint prep, settings, common weld defects, safety gear, and pipe and structural work. 7 units, 38 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Safety First",["Welding Helmet (Auto-Darkening)","Gloves & Jacket","Ventilation","Fire Watch","Eye Protection","Safety Checkpoint"]],
      [2,"Stick Welding (SMAW)",["Electrode Types (6010, 6013, 7018)","Amperage Setting","Striking the Arc","Bead Travel","Whip & Pause","Stick Checkpoint"]],
      [3,"MIG Welding (GMAW)",["Wire Speed","Voltage Setting","Shielding Gas (75/25, C25)","Push vs Pull","MIG Checkpoint"]],
      [4,"TIG Welding (GTAW)",["Tungsten Sharpening","Foot Pedal Control","Filler Rod Dip","Pulse Settings","TIG Checkpoint"]],
      [5,"Oxy-Fuel",["Acetylene vs Propane","Cutting Torch","Brazing","Heating for Forge","Oxy-Fuel Checkpoint"]],
      [6,"Joint Types",["Butt Joint","Lap Joint","Tee Joint","Corner Joint","Joints Checkpoint"]],
      [7,"Defects & Inspection",["Porosity","Undercut","Lack of Fusion","Cracks","Visual Inspection","Defects Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'welding-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('welding');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('welding');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
