    const lessons = [];

      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'rs-'+n, title: t, href: '#', unit: u, unitName: name, category: 'programming', checkpoint: i===titles.length-1 });
    if (lessons[0]) lessons[0].href = 'lesson-1.html';
      });

    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('rust');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('rust');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
