        eyebrow: 'THE ZOO OF DICE',
        title: 'Beyond the Standard Seven',
        html: '<p>You already know the classic lineup: the d4, d6, d8, d10, d12, d20, and the percentile d100. But the world of dice is much stranger and wider than that.</p><p>Hobbyists, game designers, and collectors use all sorts of <span class="le-term">non-standard dice</span> — a d3, a d5, a d16, a d24, a d30, and even a 100-sided <em>ball</em>. Each exists to solve a very specific problem at the table.</p>'

        title: 'Rolling a Die That Barely Exists',
        html: '<p>A true three-sided die is awkward to build — a flat triangle has no clean way to land. So most players <em>fake</em> a <span class="le-term">d3</span> using a die they already own.</p><p>The trick: roll an ordinary d6 and halve the result. A <strong>1 or 2</strong> becomes <strong>1</strong>, a <strong>3 or 4</strong> becomes <strong>2</strong>, and a <strong>5 or 6</strong> becomes <strong>3</strong>. Two faces map to each outcome, so all three results stay equally likely.</p>',
        visual: 'die:5'

        eyebrow: 'THE ODD ONES',
        title: 'd5, d16, d24, d30 &amp; Friends',
        html: '<p>Beyond the d3, plenty of unusual dice really are manufactured as solid shapes. There are d5, d7, and d14 dice, plus chunky d16, d24, and d30 dice used in niche games and specialty tables.</p><p>Why do they work? A die is <span class="le-term">fair</span> whenever its faces are symmetric — each face is interchangeable with every other. That symmetry, not the number of sides, is what guarantees every outcome has an equal chance.</p>'
      },
