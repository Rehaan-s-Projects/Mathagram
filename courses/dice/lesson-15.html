  <script type="module">
    import '../../js/nav.js';
    import { renderLesson } from '../../js/lesson-engine.js';
    const STEPS = [
      {
        type: 'concept',
        eyebrow: 'UNIT 1 CHECKPOINT',
        title: 'Time to put it all together',
        html: '<p>You\'ve made it through <span class="le-term">Unit 1</span>! Before we roll on, let\'s check what stuck. This quick review revisits the big ideas: reading probabilities off a single die, the <span class="le-term">complement</span> of an event, sums of two dice, <span class="le-term">expected value</span>, and how to spot a die that isn\'t playing fair.</p><p>Six questions, no pressure &ndash; take your time and think each one through. Ready?</p>',
        visual: 'die:6'
      },
      {
        type: 'question',
        eyebrow: 'REVIEW 1 OF 6',
        title: 'On a fair d6, what is P(rolling a 3)?',
        html: '<p>A standard six-sided die has six equally likely faces.</p>',
        options: ['1⁄6', '1⁄3', '3⁄6', '1'],
        answer: 0,
        explain: '<p>Correct &ndash; there is exactly <strong>one</strong> face showing a 3 out of <strong>six</strong> equally likely faces, so P(3) = <strong>1⁄6</strong>. The value 3 on the die doesn\'t change the count of favorable outcomes; every single face has the same 1⁄6 chance.</p>'
      },
      {
        type: 'question',
        eyebrow: 'REVIEW 2 OF 6',
        title: 'A fair d20 gives each face what probability?',
        html: '<p>A d20 is a twenty-sided die with faces numbered 1 through 20, all equally likely.</p>',
        options: ['1⁄6', '1⁄12', '1⁄20', '20⁄20'],
        answer: 2,
        explain: '<p>Exactly right! With <strong>20</strong> equally likely faces, each one has probability <strong>1⁄20</strong>. The same rule as the d6 applies &ndash; just divide 1 by the number of faces.</p>'
      },
      {
        type: 'question',
        eyebrow: 'REVIEW 3 OF 6',
        title: 'What is P(NOT rolling a 6) on a d6?',
        html: '<p>Remember the <span class="le-term">complement</span>: the chance an event does <em>not</em> happen is 1 minus the chance it does.</p>',
        options: ['1⁄6', '1⁄2', '5⁄6', '6⁄6'],
        answer: 2,
        explain: '<p>Nicely done! Five of the six faces are <em>not</em> a 6, so P(not 6) = <strong>5⁄6</strong>. You can also get it from the complement: 1 &ndash; 1⁄6 = <strong>5⁄6</strong>.</p>'
      },
      {
        type: 'question',
        eyebrow: 'REVIEW 4 OF 6',
        title: 'Which sum is most likely when rolling 2d6?',
        html: '<p>Think about how many different ways each total can be made from two dice.</p>',
        options: ['2', '6', '7', '12'],
        answer: 2,
        explain: '<p>Spot on! A sum of <strong>7</strong> can be made six ways (1+6, 2+5, 3+4, 4+3, 5+2, 6+1) &ndash; more than any other total. By contrast, 2 and 12 each have only one way. That\'s why <strong>7</strong> sits at the peak of the bell-shaped curve.</p>'
      },
      {
        type: 'question',
        eyebrow: 'REVIEW 5 OF 6',
        title: 'What is the expected value (average) of one fair d6?',
        html: '<p>The <span class="le-term">expected value</span> is the long-run average of the numbers you\'d roll.</p>',
        options: ['3', '3.5', '6', '21'],
        answer: 1,
        explain: '<p>Perfect! Average the faces: (1+2+3+4+5+6) &divide; 6 = 21 &divide; 6 = <strong>3.5</strong>. It\'s fine that no single face shows 3.5 &ndash; an expected value is a balance point, not a guaranteed roll.</p>'
      },
      {
        type: 'question',
        eyebrow: 'REVIEW 6 OF 6',
        title: 'Which best signals a LOADED die?',
        html: '<p>A loaded die is weighted so its outcomes aren\'t fair. What evidence actually reveals that?</p>',
        options: [
          'Its results drift away from an even 1-in-6 spread over many rolls',
          'It rolled a 6 twice in a row',
          'It feels heavy in your hand',
          'It is a different color than the other dice'
        ],
        answer: 0,
        explain: '<p>Exactly &ndash; the telltale sign is a <strong>pattern across many rolls</strong>: if the results keep drifting away from the even 1-in-6 spread you\'d expect, the die is likely loaded. Two 6s in a row is ordinary luck, and weight or color tell you nothing on their own. Evidence lives in the <span class="le-term">long-run distribution</span>.</p>'
      },
      {
        type: 'concept',
        eyebrow: 'CHECKPOINT COMPLETE',
        title: 'You\'ve got the fundamentals down',
        html: '<p>Fantastic work! You can now read a single-die probability as <strong>favorable &divide; total faces</strong>, use the <span class="le-term">complement</span> for &quot;not&quot; questions, explain why <strong>7</strong> rules two-dice sums, compute an <span class="le-term">expected value</span> of <strong>3.5</strong>, and recognize a <span class="le-term">loaded die</span> from its long-run behavior.</p><p>These ideas are the foundation for everything ahead &ndash; combining events, conditional probability, and beyond. Onward!</p>',
        visual: 'die:5'
      }
    ];
    renderLesson(document.getElementById('lesson'), STEPS, {

    });
  </script>
