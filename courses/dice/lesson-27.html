        title: 'Numbering is not random',
        html: '<p>A die has to <em>carry</em> its numbers somewhere, and where each number goes is a deliberate decision. The maker could scatter the pips any way at all &mdash; but they don’t. The <span class="le-term">arrangement</span> of numbers on the faces is engineered, and that engineering is what separates a fair randomizer from a handy counter.</p>',

        title: 'Opposite faces sum to 7',
        html: '<p>Pick up any standard six-sided die and check: 1 is across from 6, 2 is across from 5, 3 is across from 4. Every pair of opposite faces adds to <strong>7</strong>. This is the classic balancing rule &mdash; the biggest number is always paired with the smallest, so no side of the cube is loaded with high values.</p>',

        title: 'Roll and picture the hidden face',

      },
      {
        type: 'concept',
        eyebrow: 'THE d20 RULE',
        title: 'Twenty faces, one balance point',
        html: '<p>The same idea scales up. On a well-made twenty-sided die, opposite faces sum to <strong>21</strong>: 1 opposes 20, 2 opposes 19, 10 opposes 11. Beyond that, the highs and lows are deliberately <span class="le-term">spread</span> around the whole die rather than bunched together, so every region carries a mix of large and small numbers.</p>',
        visual: 'die:1'

      {
        type: 'concept',
        eyebrow: 'BALANCED vs SEQUENTIAL',
        title: 'Two very different layouts',
        html: '<p>A <span class="le-term">balanced</span> layout scatters highs and lows all around the die. This distributes any tiny weight differences from the engraving so no region is systematically favored &mdash; and it makes bias easy to spot, since a lopsided die betrays itself quickly.</p><p>A <span class="le-term">sequential</span> (or <em>spindown</em>) layout runs 1, 2, 3, &hellip; in order around the die. Great for counting down life totals, but it <strong>clusters</strong> the low numbers on one side and the highs on the other, which can amplify any imbalance. That’s why spindowns are never used for fair rolling.</p>'
