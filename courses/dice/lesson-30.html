    const STEPS = [
      {
        type: 'concept',
        eyebrow: 'UNIT 2 CHECKPOINT',
        title: 'Time to Test Your Dice Knowledge',
        html: '<p>Nice work reaching the checkpoint! In <span class="le-term">Unit 2</span> you explored the whole family of dice &ndash; from the humble six-sider to the mighty twenty-sided <strong>d20</strong>.</p><p>This is a quick <em>six-question</em> review. Take your time, trust what you have learned, and roll on!</p>',
        visual: 'die:6'
      },
      {
        type: 'question',
        eyebrow: 'QUESTION 1',
        title: 'How many faces does a d20 have?',
        html: '<p>The name is a big hint.</p>',
        options: ['24', '12', '20', '10'],
        answer: 2,
        explain: '<p>Correct &ndash; a <span class="le-term">d20</span> has exactly <strong>20 faces</strong>. The &ldquo;d&rdquo; means &ldquo;die&rdquo; and the number tells you the face count, so a d20 is a twenty-sided die.</p>'
      },
      {
        type: 'question',
        eyebrow: 'QUESTION 2',
        title: 'A standard d10 is numbered how?',
        options: ['1 through 10', '0 through 9', '1 through 9', '0 through 10'],
        answer: 1,
        explain: '<p>Exactly! A standard <span class="le-term">d10</span> is numbered <strong>0 through 9</strong> &ndash; ten faces in total. That zero is what makes it perfect for building percentile rolls.</p>'
      },
      {
        type: 'question',
        eyebrow: 'QUESTION 3',
        title: 'How many Platonic solids are there?',
        html: '<p>These are the perfectly symmetric shapes behind most classic dice.</p>',
        options: ['3', '5', '6', '7'],
        answer: 1,
        explain: '<p>Right &ndash; there are exactly <strong>5</strong> <span class="le-term">Platonic solids</span>: the tetrahedron, cube, octahedron, dodecahedron, and icosahedron. They give us the d4, d6, d8, d12, and d20.</p>'

      {
        type: 'question',
        eyebrow: 'QUESTION 4',
        title: 'How is a percentile d100 roll usually made?',
        options: ['Rolling one 100-sided ball', 'Rolling a d20 five times', 'Rolling two d10s (a tens die and a ones die)', 'Rolling a d50 twice'],
        answer: 2,
        explain: '<p>Yes! A <span class="le-term">d100</span> (percentile) result usually comes from <strong>rolling two d10s</strong> &ndash; one read as the tens digit and one as the ones digit &ndash; giving values from 00 to 99.</p>'

      {
        type: 'question',
        eyebrow: 'QUESTION 5',
        title: 'Which of these is NOT a standard polyhedral RPG die?',
        options: ['a d8', 'a d12', 'a d7', 'a d20'],

        explain: '<p>Correct! The <strong>d7</strong> is not part of the standard polyhedral set. The classic RPG dice are the d4, d6, d8, d10, d12, and d20 &ndash; no seven-sided die among them.</p>'
