        eyebrow: 'A FEW ROLLS',
        title: 'Small samples are lumpy',
        html: '<p>Roll a fair die just a handful of times and the results almost never look "fair." You might get three 5s and no 2s at all. That is not a broken die &ndash; it is just <span class="le-term">randomness</span> being noisy.</p><p>With only a few rolls, streaks and gaps are completely normal. The pattern only shows up when you zoom way out.</p>',

        eyebrow: 'THE BIG IDEA',
        title: 'The Law of Large Numbers',
        html: '<p>The <span class="le-term">Law of Large Numbers</span> says this: as you repeat a random experiment more and more times, the <strong>observed average</strong> and the <strong>observed frequencies</strong> get closer and closer to the theoretical values.</p><p>For a fair d6, each face has a true chance of <strong>1&frasl;6</strong> &asymp; 16.7%, and the true long-run average roll is <strong>3.5</strong>. A few rolls wander far from these numbers; thousands of rolls settle right onto them.</p>'
      },
      {
        type: 'interactive',
        variant: 'roll-die',
        eyebrow: 'TRY IT',
        title: 'Roll a bunch and watch the tally',

      },
      {
        type: 'concept',
        eyebrow: 'NO MEMORY',
        title: 'The gambler&rsquo;s fallacy',
        html: '<p>Suppose you just rolled five 6s in a row. It feels like a non-six is "due." It is not. A die has <span class="le-term">no memory</span> &ndash; it does not know what it rolled before.</p><p>Believing the past changes the next roll is the <span class="le-term">gambler&rsquo;s fallacy</span>. The averages even out not because the die corrects itself, but because a few weird rolls get <em>diluted</em> by an ocean of ordinary ones.</p>'

      {
        type: 'concept',
        eyebrow: 'RECAP',
        title: 'Averages settle, dice don&rsquo;t remember',
        html: '<p>The <span class="le-term">Law of Large Numbers</span>: more repetitions pull the observed average and frequencies toward their true values. For a d6, faces approach a 1&frasl;6 share and the mean approaches <strong>3.5</strong>.</p><p>Small samples are lumpy and streaky &ndash; that is fine. And because a die has <span class="le-term">no memory</span>, no outcome is ever "due." The long run smooths things out by <em>dilution</em>, not by correction.</p>'
