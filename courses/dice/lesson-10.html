        title: 'What an honest die does',
        html: '<p>A trustworthy six-sided die is perfectly balanced: every face is equally likely, so each one shows up about <strong>1 time in 6</strong>. That evenness is the whole point of a fair game.</p><p>A cheater&rsquo;s goal is to quietly break that balance. In this lesson we&rsquo;ll see the tricks &mdash; and, more importantly, how they get <span class="le-term">caught</span>.</p>',

        title: 'Loading: a hidden weight',
        html: '<p><span class="le-term">Loading</span> means hiding extra weight inside the die, close to one face. When you toss it, gravity pulls the heavy side <em>down</em> &mdash; which means the <strong>opposite</strong> face tends to end up on top.</p><p>So a weight tucked behind the &ldquo;1&rdquo; makes the die land showing &ldquo;6&rdquo; more often than it should. Remember: on a standard die, opposite faces always add to <strong>7</strong>.</p>'
      },
      {
        type: 'concept',
        eyebrow: 'THE TRICK',
        title: 'Shaving and shaping',
        html: '<p>Not every rigged die hides a weight. In <span class="le-term">shaving</span>, a cheater sands one or two faces so they&rsquo;re slightly larger, flatter, or less square than the rest.</p><p>A die is more likely to come to rest on a <strong>bigger, flatter</strong> face, so the trimmed sides come up more often. The change can be a fraction of a millimeter &mdash; too small to see, but not too small to <em>measure</em>.</p>'

      {
        type: 'concept',
        eyebrow: 'DETECTION',
        title: 'The salt-water float test',
        html: '<p>Here&rsquo;s a classic check. Dissolve enough salt in a glass of water and a plastic die will float. Spin it gently and watch.</p><p>A fair die tumbles and stops in <strong>random</strong> orientations. A <span class="le-term">loaded</span> die keeps rotating so its heavy side sinks and its favorite face floats <em>up</em> &mdash; the same face, over and over. That stubborn preference is a red flag.</p>'

        type: 'concept',
        eyebrow: 'DETECTION',
        title: 'The most reliable test: many rolls',
        html: '<p>Floats and calipers can catch obvious fakes, but a <em>subtle</em> bias needs numbers. Roll the die a lot &mdash; hundreds of times &mdash; and keep a <span class="le-term">tally</span> of each face.</p><p>A fair die&rsquo;s tallies drift toward an even 1-in-6 spread. A loaded die piles up on its favorite face. Comparing your counts to that fair spread is the heart of a <span class="le-term">statistical test</span> (you&rsquo;ll meet the chi-square test soon).</p>'

        ],
        answer: 0,
        explain: '<p>A single roll tells you nothing &mdash; even a fair die shows a 6 sometimes. A subtle bias only reveals itself in the <strong>long run</strong>: roll many times, tally the faces, and compare to the even 1-in-6 spread a fair die should give. That statistical comparison is the gold standard.</p>'
