        type: 'concept',
        eyebrow: 'WHAT MAKES A DIE FAIR',
        title: 'Fairness lives in the shape',
        html: '<p>A die is <span class="le-term">fair</span> when every face has an equal chance of landing up. But you can’t <em>promise</em> fairness by painting numbers on — you have to earn it with <strong>geometry</strong>.</p><p>The trick: make every face an <strong>identical</strong> shape, and make every corner look exactly the same as every other corner. If no face is special, no face can be favored. That perfect sameness is called <span class="le-term">symmetry</span>.</p>',

      {
        type: 'concept',
        eyebrow: 'THE ELITE FIVE',
        title: 'The Platonic solids',
        html: '<p>Exactly five 3D shapes pull off total symmetry — every face an identical regular polygon, every corner identical. These are the <span class="le-term">Platonic solids</span>, and each one is a natural die:</p><p><strong>Tetrahedron</strong> → 4 triangles → the <span class="le-term">d4</span>.<br><strong>Cube</strong> → 6 squares → the <span class="le-term">d6</span>.<br><strong>Octahedron</strong> → 8 triangles → the <span class="le-term">d8</span>.<br><strong>Dodecahedron</strong> → 12 pentagons → the <span class="le-term">d12</span>.<br><strong>Icosahedron</strong> → 20 triangles → the <span class="le-term">d20</span>.</p><p>Because each is flawlessly symmetric, it is <em>naturally fair</em> — no gluing tricks required.</p>'
      },
      {
        type: 'interactive',
        variant: 'dice-roller',
        eyebrow: 'FEEL THE FAIRNESS',
        title: 'Roll a Platonic die',
        html: '<p>Pick a d4, d6, d8, d12, or d20 and roll away. Every one of these is a Platonic solid, so each face is equally likely — roll enough times and the outcomes even out.</p>'
      },
      {
        type: 'concept',
        eyebrow: 'WHY NOT SIX? OR SIXTY?',
        title: 'Geometry stops at five',
        html: '<p>Why not a sixth Platonic solid? At every corner you must fit at least <strong>three</strong> faces, and their angles must add to <em>less</em> than 360&deg; — otherwise the corner flattens out and can’t fold into a solid.</p><p>Squeeze the math and only <strong>five</strong> arrangements survive. It’s not that nobody has found a sixth yet; it’s <em>provably impossible</em>. Five, forever.</p>'
      },
      {
        type: 'concept',
        eyebrow: 'THE FAMOUS EXCEPTION',
        title: 'The d10 breaks the pattern',
        html: '<p>Reach into a dice bag and the ten-sided <span class="le-term">d10</span> is nobody’s Platonic solid — its faces are kite-shaped, not regular polygons. Its real name is a <span class="le-term">pentagonal trapezohedron</span>.</p><p>Yet the d10 is still <strong>fair!</strong> Its ten faces are all symmetric <em>to each other</em>, so no face is favored. Lesson: Platonic solids <em>guarantee</em> fairness, but they aren’t the <em>only</em> shapes that can achieve it.</p>'
