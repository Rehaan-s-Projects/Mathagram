    const STEPS = [

        type: 'concept',
        eyebrow: 'THREE WAYS, ONE CHANCE',
        title: 'The same chance, three costumes',
        html: '<p>Rolling a <strong>1</strong> on a fair die is <em>one</em> possibility out of six. We call that a probability of <span class="le-term">1&#8260;6</span>.</p><p>But math has three ways to say the exact same thing: as a <span class="le-term">fraction</span> (1&#8260;6), as a <span class="le-term">decimal</span> (&asymp; 0.167), or as a <span class="le-term">percent</span> (&asymp; 16.7%). Different costumes &ndash; same chance underneath.</p>',
        visual: 'die:1'
      },
      {
        type: 'concept',
        eyebrow: 'FRACTION &rarr; DECIMAL',
        title: 'Divide to get the decimal',
        html: '<p>To turn a fraction into a decimal, just <strong>divide the top by the bottom</strong>.</p><p>For 1&#8260;6, compute 1 &divide; 6 = 0.1666&hellip;, which we round to <strong>0.167</strong>. The fraction bar literally means &ldquo;divide.&rdquo;</p>',
        visual: 'die:1'
      },
      {
        type: 'concept',
        eyebrow: 'DECIMAL &rarr; PERCENT',
        title: 'Multiply by 100 for percent',
        html: '<p>&ldquo;Percent&rdquo; means <em>per hundred</em>, so to get a percent you <strong>multiply the decimal by 100</strong> and add a % sign.</p><p>0.167 &times; 100 = <strong>16.7%</strong>. Putting it all together: 1&#8260;6 &asymp; 0.167 &asymp; <span class="le-term">16.7%</span>.</p>',
      },
      {
        type: 'concept',
        eyebrow: 'THE 0-TO-1 SCALE',
        title: 'Every probability lives between 0 and 1',
        html: '<p>No probability can be smaller than <strong>0</strong> or larger than <strong>1</strong>.</p><p>A probability of <span class="le-term">0</span> (that is 0%) means <em>impossible</em> &ndash; it can never happen. A probability of <span class="le-term">1</span> (that is 100%) means <em>certain</em> &ndash; it always happens. Every real chance, like &frac12; or 1&#8260;6, sits somewhere in between.</p>',
      },
      {

        type: 'question',

      {

        answer: 3,
        explain: '<p>0.5, 1&#8260;6, and 75% all fall between 0 and 1 (75% = 0.75), so they are fine. But <strong>1.4</strong> equals 140%, which is <em>more than certain</em> &ndash; impossible! Every valid probability must stay between 0 and 1.</p>'

      {
        type: 'concept',
        eyebrow: 'RECAP',
        title: 'One chance, spoken three ways',
