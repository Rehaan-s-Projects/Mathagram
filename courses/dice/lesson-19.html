        title: 'The d8 &mdash; a New Shape',
        html: '<p>So far you have spent most of your time with the humble cube. Now meet the <span class="le-term">d8</span>: a die with <strong>eight faces</strong>, each one an <em>equilateral triangle</em>.</p><p>Instead of the flat squares of a d6, the d8 comes to a sharp point at the top and bottom &mdash; a crystal-like gem you roll across the table.</p>'
