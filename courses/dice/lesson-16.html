    const STEPS = [
      {
        type: 'concept',
        eyebrow: 'MEET THE FAMILY',
        title: 'Seven Dice, One Set',
        html: '<p>The little six-sided cube you know from board games has a big family. Tabletop games and role-playing games like <em>Dungeons &amp; Dragons</em> use a set of <strong>seven</strong> different dice.</p><p>Some are pointy pyramids, some are chunky gems, and one even looks like a golf ball. Together they are called the <span class="le-term">polyhedral dice</span> &mdash; a <em>polyhedron</em> is just a solid shape with flat faces.</p>',
        visual: 'die:6'
      },
      {
        type: 'concept',
        eyebrow: 'THE NAMING RULE',
        title: 'What Does "dN" Mean?',
        html: '<p>Each die has a short name that starts with a lowercase <strong>d</strong>. The rule is simple: a <span class="le-term">dN</span> is a die with <strong>N faces</strong>.</p><p>So a <strong>d6</strong> has 6 faces (the classic cube), a <strong>d20</strong> has 20 faces, and a <strong>d4</strong> has just 4. Once you know the rule, you can read any die&rsquo;s name at a glance.</p>'
      },
      {
        type: 'concept',
        eyebrow: 'WHY SO MANY?',
        title: 'Different Ranges of Numbers',
        html: '<p>Why not just use one die for everything? Because games need <strong>different ranges</strong> of random numbers.</p><p>Need a number from 1 to 4? Roll the d4. From 1 to 20? Roll the d20. Each die gives its own range, so having the whole set means you always have the right tool for the job. The standard seven are the <strong>d4, d6, d8, d10, d12, d20,</strong> and <strong>d100</strong>.</p>'
      },
      {
        type: 'interactive',
        variant: 'dice-roller',
        eyebrow: 'TRY IT',
        title: 'Roll the Whole Family',
        html: '<p>Pick any die from the set and give it a roll. Notice how the <strong>biggest number</strong> you can get always matches the die&rsquo;s name &mdash; a d8 tops out at 8, a d20 tops out at 20. Explore all seven!</p>'
      },
      {
        type: 'question',
        eyebrow: 'CHECK YOURSELF',
        title: 'Which die has 20 faces?',
        html: '<p>Use the naming rule you just learned.</p>',
        options: ['The d6', 'The d12', 'The d20', 'The d4'],
        answer: 2,
        explain: '<p>Correct! A <strong>dN</strong> has N faces, so the die with 20 faces is the <span class="le-term">d20</span> &mdash; the iconic icosahedron that D&amp;D players roll for almost everything.</p>'
      },
      {
        type: 'question',
        eyebrow: 'CHECK YOURSELF',
        title: 'On a fair dN, how likely is any one face?',

        eyebrow: 'RECAP',
        title: 'The Family Portrait',
