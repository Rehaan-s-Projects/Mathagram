        title: 'What is a sample space?',
        html: '<p>Before you can talk about the <em>chance</em> of something, you need to know everything that <strong>could</strong> happen. A <span class="le-term">sample space</span> is the complete set of all possible outcomes of a random experiment.</p><p>Roll a single six-sided die and it must land showing one of six faces &ndash; nothing else. That full list of possibilities is the sample space.</p>',

        html: '<p>We write a sample space with curly braces, listing every outcome exactly once:</p><p><strong>{1, 2, 3, 4, 5, 6}</strong></p><p>That is <strong>6 outcomes</strong> in total. Every roll of a fair die lands on precisely one of them, and each is equally likely.</p>',
        visual: 'die:3'
      },
      {
        type: 'concept',
        eyebrow: 'EVENTS',
        title: 'An event is a subset',
        html: '<p>An <span class="le-term">event</span> is any part of the sample space you care about &ndash; a subset of those outcomes.</p><p>&ldquo;Roll an even number&rdquo; is the event <strong>{2, 4, 6}</strong>. &ldquo;Roll a number bigger than 4&rdquo; is <strong>{5, 6}</strong>. An event can be one outcome, several, all of them, or even none.</p>'

        eyebrow: 'THE RULE',
