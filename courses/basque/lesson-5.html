<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 5 · Pronunciation — Euskara — Basque — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/lesson-engine.css">
  <style>
    .eu-row { display: flex; align-items: center; gap: 14px; margin: 14px 0; text-align: left; }
    .eu-av { width: 62px; height: 62px; flex-shrink: 0; border-radius: 50%; background: #fff;
             padding: 4px; border: 2px solid #7dd3fc; box-shadow: 0 4px 14px rgba(14,165,233,0.22); }
    .eu-bubble { position: relative; flex: 1; background: #f0f9ff; border: 1px solid #bae6fd;
                 border-radius: 14px; padding: 10px 14px; }
    .eu-bubble::before { content: ''; position: absolute; left: -8px; top: 22px; width: 0; height: 0;
                 border: 8px solid transparent; border-right-color: #f0f9ff; border-left: 0; }
    .eu-name { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #0284c7; }
    .eu-eu { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 2px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .eu-pron { font-size: 0.82rem; color: #0ea5e9; font-style: italic; }
    .eu-en { font-size: 0.95rem; color: #475569; }
    .eu-say { border: none; background: #0ea5e9; color: #fff; border-radius: 999px;
              width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; line-height: 1;
              box-shadow: 0 2px 6px rgba(14,165,233,0.35); }
    .eu-say:hover { background: #0284c7; }
    .eu-say:active { transform: scale(0.92); }
  </style>
</head>
<body class="le-body">
  <script type="module" src="../../js/auth-gate.js" data-base="../../"></script>
  <div id="lesson"></div>
  <script type="module">
    import '../../js/nav.js';
    import { renderLesson } from '../../js/lesson-engine.js';
    function say(avatar, name, eu, pron, en) {
      return `<div class="eu-row">
        <img class="eu-av" src="../../assets/characters/${avatar}.svg" alt="${name}">
        <div class="eu-bubble">
          <div class="eu-name">${name}</div>
          <div class="eu-eu">${eu}
            <button class="eu-say" type="button" data-say="${eu.replace(/"/g, '&quot;')}" data-voice="${avatar}" aria-label="Hear ${name} say it">🔊</button>
          </div>
          <div class="eu-pron">${pron}</div>
          <div class="eu-en">${en}</div>
        </div>
      </div>`;
    }
    const STEPS = [
      {
        type: 'concept',
        eyebrow: 'Pronunciation',
        title: 'Say it as you see it',
        html: `<p>Good news! Basque is written almost exactly as it sounds. Once you learn a handful of letter combinations, you can read almost any word out loud.</p>`
          + say('lingo', 'Lingo', 'kaixo', 'KY-sho', 'hello')
          + `<p>Let's meet a few letters that don't sound the way an English speaker might expect.</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'The letter R',
        title: 'A soft tap vs. a strong roll',
        html: `<p>A single <strong>r</strong> is a soft, quick tap of the tongue. Double <strong>rr</strong> is a strong, rolled or trilled R — hold it and let it buzz!</p>`
          + say('diego', 'Diego', 'txakur', 'CHA-koor', 'dog')
          + `<p>Listen to the gentle single <strong>r</strong> at the end of <em>txakur</em>. For an <strong>rr</strong>, you would roll that sound much harder.</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'The combo TX',
        title: 'TX = "ch" as in "church"',
        html: `<p>Whenever you see <strong>tx</strong>, make the "ch" sound from "church".</p>`
          + say('rita', 'Rita', 'etxe', 'EH-cheh', 'house')
          + say('sam', 'Sam', 'txakur', 'CHA-koor', 'dog')
          + `<p>So <em>etxe</em> becomes "EH-cheh" and <em>txakur</em> becomes "CHA-koor".</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'TZ and X',
        title: 'Two more sounds',
        html: `<p>The combo <strong>tz</strong> sounds like the "ts" in "cats". And the letter <strong>x</strong> sounds like the English "sh".</p>`
          + say('gosia', 'Gosia', 'hitz', 'heets', 'word')
          + say('james', 'James', 'kaixo', 'KY-sho', 'hello')
          + `<p><em>hitz</em> ends with that crisp "ts" sound, while <em>kaixo</em> hides a "sh" right in the middle.</p>`,
      },
      {
        type: 'question',
        eyebrow: 'Quick check',
        title: 'How do you pronounce TX?',
        options: [
          'Like "ch" in "church"',
          'Like a sneezing hamster',
          'Like "th" in "think"',
          'Like a slamming door',
        ],
        answer: 0,
        explain: `<p>Correct! <strong>tx</strong> is the "ch" sound, so <em>etxe</em> is "EH-cheh" (house) and <em>txakur</em> is "CHA-koor" (dog).</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'Z and J',
        title: 'Softening things down',
        html: `<p>The letter <strong>z</strong> is a soft "s" sound. And in standard Basque, <strong>j</strong> is usually pronounced like the English "y" in "yes".</p>`
          + say('william', 'William', 'zu', 'soo', 'you')
          + `<p>So <em>zu</em> sounds like "soo" — a gentle "s", never a buzzing "z".</p>`,
      },
      {
        type: 'question',
        eyebrow: 'Quick check',
        title: 'Which word means "dog"?',
        options: [
          'kaixo',
          'txakur',
          'a slice of pizza',
          'a thunderstorm',
        ],
        answer: 1,
        explain: `<p>Yes! <em>txakur</em> (CHA-koor) means "dog". Remember that <em>kaixo</em> (KY-sho) means "hello".</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'Recap',
        title: 'You can read Basque now!',
        html: `<p>Great work! Here are the sounds you just learned:</p>`
          + `<ul>
              <li><strong>rr</strong> — a strong, rolled R (a single <strong>r</strong> is a soft tap)</li>
              <li><strong>tx</strong> — "ch" as in "church" (<em>etxe</em>, <em>txakur</em>)</li>
              <li><strong>tz</strong> — "ts" as in "cats" (<em>hitz</em>)</li>
              <li><strong>x</strong> — "sh" (<em>kaixo</em>)</li>
              <li><strong>z</strong> — a soft "s" (<em>zu</em>)</li>
              <li><strong>j</strong> — like "y" in "yes"</li>
            </ul>`
          + say('edam', 'Edam', 'kaixo', 'KY-sho', 'hello')
          + `<p>Now you can sound out almost any Basque word you meet.</p>`,
      },
    ];
    renderLesson(document.getElementById('lesson'), STEPS, {
      courseId: 'basque',
      lessonId: 'eu-5',
      backHref: 'index.html',
      courseName: 'Euskara — Basque',
    });
    const VOICE = {
      lingo:{pitch:1.05,rate:0.90,vi:0}, rita:{pitch:1.55,rate:0.95,vi:1}, diego:{pitch:0.80,rate:0.88,vi:2},
      gosia:{pitch:1.35,rate:0.92,vi:3}, james:{pitch:0.68,rate:0.85,vi:4}, sam:{pitch:1.20,rate:0.98,vi:5},
      william:{pitch:0.92,rate:0.87,vi:6}, steve:{pitch:1.70,rate:1.00,vi:7}, babel:{pitch:1.10,rate:0.90,vi:8},
      edam:{pitch:0.60,rate:0.82,vi:9},
    };
    function speak(text, who) {
      try {
        const synth = window.speechSynthesis; if (!synth) return; synth.cancel();
        const prof = VOICE[who] || { pitch: 1, rate: 0.9, vi: 0 };
        const u = new SpeechSynthesisUtterance(text); u.lang = 'eu-ES'; u.pitch = prof.pitch; u.rate = prof.rate;
        const voices = synth.getVoices() || [];
        const pool = voices.filter(x => /^eu\b|^eu[-_]/i.test(x.lang));
        const espool = voices.filter(x => /^es\b|^es[-_]/i.test(x.lang));
        const chosen = pool.length ? pool : espool;
        if (chosen.length) u.voice = chosen[prof.vi % chosen.length];
        synth.speak(u);
      } catch {}
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]'); if (!b) return; e.preventDefault();
      speak(b.getAttribute('data-say'), b.getAttribute('data-voice'));
    });
  </script>
</body>
</html>
