<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 9 · Etxea — Home — Euskara — Basque — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/lesson-engine.css">
  <style>
    .eu-row { display: flex; align-items: center; gap: 14px; margin: 14px 0; text-align: left; }
    .eu-av { width: 62px; height: 62px; flex-shrink: 0; border-radius: 50%; background: #fff;
             padding: 4px; border: 2px solid #7dd3fc; box-shadow: 0 4px 14px rgba(14,165,233,0.22); }
    .eu-bubble { position: relative; flex: 1; background: #f0f9ff; border: 1px solid #bae6fd;
                 border-radius: 14px; padding: 10px 14px; }
    .eu-bubble::before { content: ''; position: absolute; left: -8px; top: 22px; width: 0; height: 0;
                 border: 8px solid transparent; border-right-color: #f0f9ff; border-left: 0; }
    .eu-name { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #0284c7; }
    .eu-eu { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 2px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .eu-pron { font-size: 0.82rem; color: #0ea5e9; font-style: italic; }
    .eu-en { font-size: 0.95rem; color: #475569; }
    .eu-say { border: none; background: #0ea5e9; color: #fff; border-radius: 999px;
              width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; line-height: 1;
              box-shadow: 0 2px 6px rgba(14,165,233,0.35); }
    .eu-say:hover { background: #0284c7; }
    .eu-say:active { transform: scale(0.92); }
  </style>
</head>
<body class="le-body">
  <script type="module" src="../../js/auth-gate.js" data-base="../../"></script>
  <div id="lesson"></div>
  <script type="module">
    import '../../js/nav.js';
    import { renderLesson } from '../../js/lesson-engine.js';
    function say(avatar, name, eu, pron, en) {
      return `<div class="eu-row">
        <img class="eu-av" src="../../assets/characters/${avatar}.svg" alt="${name}">
        <div class="eu-bubble">
          <div class="eu-name">${name}</div>
          <div class="eu-eu">${eu}
            <button class="eu-say" type="button" data-say="${eu.replace(/"/g, '&quot;')}" data-voice="${avatar}" aria-label="Hear ${name} say it">🔊</button>
          </div>
          <div class="eu-pron">${pron}</div>
          <div class="eu-en">${en}</div>
        </div>
      </div>`;
    }
    const STEPS = [
      {
        type: 'concept',
        eyebrow: 'Etxea',
        title: 'Welcome home',
        html: `<p>Every Basque story begins somewhere cozy: the <strong>etxea</strong>. In Euskara the house is more than four walls — it is the heart of family life, and its name pops up everywhere.</p>`
          + say('lingo', 'Lingo', 'etxea', 'eh-CHEH-ah', 'the house / home')
          + `<p>Say it slowly — <em>eh-CHEH-ah</em>. That "tx" makes a soft "ch" sound. Let us walk inside and meet the everyday objects that live there.</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'Sarrera',
        title: 'The door and the window',
        html: `<p>First stop at the entrance. To get in, you need an <strong>ate</strong>, and to let the light in, a <strong>leiho</strong>.</p>`
          + say('rita', 'Rita', 'ate', 'AH-teh', 'door')
          + say('diego', 'Diego', 'leiho', 'LAY-oh', 'window')
          + `<p>Tap the 🔊 buttons to hear each word. Open the ate, peek through the leiho — you are officially home.</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'Altzariak',
        title: 'Furniture: table, chair, bed',
        html: `<p>Now the furniture. Sit down at the <strong>mahai</strong>, pull up an <strong>aulki</strong>, and rest on the <strong>ohea</strong>.</p>`
          + say('gosia', 'Gosia', 'mahai', 'MAH-eye', 'table')
          + say('james', 'James', 'aulki', 'OWL-kee', 'chair')
          + say('sam', 'Sam', 'ohea', 'oh-EH-ah', 'the bed')
          + `<p>Notice how <em>ohea</em> ends in "-a" — just like <em>etxea</em>. That little "-a" means "the".</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'Gauzak',
        title: 'A book and some water',
        html: `<p>Two last comforts before we test what you know: something to read and something to drink.</p>`
          + say('william', 'William', 'liburua', 'lee-BOO-roo-ah', 'the book')
          + say('babel', 'Babel', 'ura', 'OO-rah', 'water')
          + `<p>Curl up on the ohea with a good liburua and a glass of ura. Now let us check in.</p>`,
      },
      {
        type: 'question',
        eyebrow: 'Galdera',
        title: 'What does "ate" mean?',
        options: [
          'door',
          'a sneezing dragon',
          'window',
          'a thunderstorm inside the fridge',
        ],
        answer: 0,
        explain: `<p><strong>ate</strong> (<em>AH-teh</em>) means <strong>door</strong>. "Window" is <em>leiho</em> — the plausible mix-up, but no dragons or fridge-storms live in the etxea!</p>`,
      },
      {
        type: 'question',
        eyebrow: 'Galdera',
        title: 'Which word means "table"?',
        options: [
          'a penguin doing taxes',
          'aulki',
          'mahai',
          'a whispering cloud',
        ],
        answer: 2,
        explain: `<p><strong>mahai</strong> (<em>MAH-eye</em>) is the <strong>table</strong>. <em>aulki</em> is the chair you pull up to it — close, but not the table itself.</p>`,
      },
      {
        type: 'concept',
        eyebrow: 'Laburpena',
        title: 'Recap: your Basque home',
        html: `<p>You furnished a whole etxea! Here is everything under one roof:</p>`
          + say('edam', 'Edam', 'etxea', 'eh-CHEH-ah', 'the house / home')
          + say('rita', 'Rita', 'ate', 'AH-teh', 'door')
          + say('diego', 'Diego', 'leiho', 'LAY-oh', 'window')
          + say('gosia', 'Gosia', 'mahai', 'MAH-eye', 'table')
          + say('james', 'James', 'aulki', 'OWL-kee', 'chair')
          + say('sam', 'Sam', 'ohea', 'oh-EH-ah', 'the bed')
          + say('william', 'William', 'liburua', 'lee-BOO-roo-ah', 'the book')
          + say('babel', 'Babel', 'ura', 'OO-rah', 'water')
          + `<p>Eskerrik asko &amp; agur — thanks &amp; goodbye from your Basque home!</p>`,
      },
    ];
    renderLesson(document.getElementById('lesson'), STEPS, {
      courseId: 'basque',
      lessonId: 'eu-9',
      backHref: 'index.html',
      courseName: 'Euskara — Basque',
    });
    const VOICE = {
      lingo:{pitch:1.05,rate:0.90,vi:0}, rita:{pitch:1.55,rate:0.95,vi:1}, diego:{pitch:0.80,rate:0.88,vi:2},
      gosia:{pitch:1.35,rate:0.92,vi:3}, james:{pitch:0.68,rate:0.85,vi:4}, sam:{pitch:1.20,rate:0.98,vi:5},
      william:{pitch:0.92,rate:0.87,vi:6}, steve:{pitch:1.70,rate:1.00,vi:7}, babel:{pitch:1.10,rate:0.90,vi:8},
      edam:{pitch:0.60,rate:0.82,vi:9},
    };
    function speak(text, who) {
      try {
        const synth = window.speechSynthesis; if (!synth) return; synth.cancel();
        const prof = VOICE[who] || { pitch: 1, rate: 0.9, vi: 0 };
        const u = new SpeechSynthesisUtterance(text); u.lang = 'eu-ES'; u.pitch = prof.pitch; u.rate = prof.rate;
        const voices = synth.getVoices() || [];
        const pool = voices.filter(x => /^eu\b|^eu[-_]/i.test(x.lang));
        const espool = voices.filter(x => /^es\b|^es[-_]/i.test(x.lang));
        const chosen = pool.length ? pool : espool;
        if (chosen.length) u.voice = chosen[prof.vi % chosen.length];
        synth.speak(u);
      } catch {}
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]'); if (!b) return; e.preventDefault();
      speak(b.getAttribute('data-say'), b.getAttribute('data-voice'));
    });
  </script>
</body>
</html>
