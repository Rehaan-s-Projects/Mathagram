<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 2 · Greetings &amp; Farewells — Euskara — Basque — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/lesson-engine.css">
  <style>
    .eu-row { display: flex; align-items: center; gap: 14px; margin: 14px 0; text-align: left; }
    .eu-av { width: 62px; height: 62px; flex-shrink: 0; border-radius: 50%; background: #fff;
             padding: 4px; border: 2px solid #7dd3fc; box-shadow: 0 4px 14px rgba(14,165,233,0.22); }
    .eu-bubble { position: relative; flex: 1; background: #f0f9ff; border: 1px solid #bae6fd;
                 border-radius: 14px; padding: 10px 14px; }
    .eu-bubble::before { content: ''; position: absolute; left: -8px; top: 22px; width: 0; height: 0;
                 border: 8px solid transparent; border-right-color: #f0f9ff; border-left: 0; }
    .eu-name { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #0284c7; }
    .eu-eu { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 2px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .eu-pron { font-size: 0.82rem; color: #0ea5e9; font-style: italic; }
    .eu-en { font-size: 0.95rem; color: #475569; }
    .eu-say { border: none; background: #0ea5e9; color: #fff; border-radius: 999px;
              width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; line-height: 1;
              box-shadow: 0 2px 6px rgba(14,165,233,0.35); }
    .eu-say:hover { background: #0284c7; }
    .eu-say:active { transform: scale(0.92); }
  </style>
</head>
<body class="le-body">
  <script type="module" src="../../js/auth-gate.js" data-base="../../"></script>
  <div id="lesson"></div>
  <script type="module">
    import '../../js/nav.js';
    import { renderLesson } from '../../js/lesson-engine.js';
    function say(avatar, name, eu, pron, en) {
      return `<div class="eu-row">
        <img class="eu-av" src="../../assets/characters/${avatar}.svg" alt="${name}">
        <div class="eu-bubble">
          <div class="eu-name">${name}</div>
          <div class="eu-eu">${eu}
            <button class="eu-say" type="button" data-say="${eu.replace(/"/g, '&quot;')}" data-voice="${avatar}" aria-label="Hear ${name} say it">🔊</button>
          </div>
          <div class="eu-pron">${pron}</div>
          <div class="eu-en">${en}</div>
        </div>
      </div>`;
    }
    const STEPS = [
      {
        type: 'concept',
        eyebrow: 'WELCOME BACK',
        title: 'Saying hello and goodbye',
        html: `<p>In Basque, greetings change with the time of day — but one friendly word works around the clock. Meet <strong>Kaixo</strong>, your all-purpose hello, and <strong>Agur</strong>, the classic goodbye.</p>`
          + say('lingo', 'Lingo', 'Kaixo', 'KY-sho', 'Hello (any time)')
          + say('agur' === 'agur' ? 'rita' : 'rita', 'Rita', 'Agur', 'ah-GOOR', 'Goodbye')
          + `<p>Say them out loud, then let's learn the greetings that follow the sun across the sky.</p>`
      },
      {
        type: 'concept',
        eyebrow: 'BY TIME OF DAY',
        title: 'Greetings from morning to night',
        html: `<p>Basque greetings track the clock. Use each one at its moment:</p>`
          + say('diego', 'Diego', 'Egun on', 'EH-goon ohn', 'Good morning')
          + say('gosia', 'Gosia', 'Arratsalde on', 'ah-RRAHT-sahl-deh ohn', 'Good afternoon')
          + say('james', 'James', 'Gabon', 'GAH-bohn', 'Good evening / good night')
          + `<p>Notice the pattern: <strong>on</strong> means "good," so <em>Egun on</em> is literally "good day/morning."</p>`
      },
      {
        type: 'concept',
        eyebrow: 'FAREWELLS',
        title: 'Three ways to say goodbye',
        html: `<p>When it's time to leave, you have options — from a simple goodbye to a promise to return:</p>`
          + say('sam', 'Sam', 'Agur', 'ah-GOOR', 'Goodbye')
          + say('william', 'William', 'Gero arte', 'GEH-ro AR-teh', 'See you later')
          + say('steve', 'Steve', 'Bihar arte', 'BEE-ar AR-teh', 'See you tomorrow')
          + `<p>See <strong>arte</strong> in the last two? It signals "until" — <em>until later</em>, <em>until tomorrow</em>.</p>`
      },
      {
        type: 'question',
        eyebrow: 'Quick check',
        title: 'Someone says "Arratsalde on." What did they wish you?',
        options: [
          'Good afternoon',
          'Good morning',
          'A screaming teapot balancing on a unicycle',
          'A basket of angry eels at midnight'
        ],
        answer: 0,
        explain: `<p><strong>Arratsalde on</strong> (ah-RRAHT-sahl-deh ohn) means <strong>Good afternoon</strong>. "Good morning" is the tempting near-miss — that's <em>Egun on</em>.</p>`
      },
      {
        type: 'concept',
        eyebrow: 'MAKE THEM FEEL AT HOME',
        title: 'Welcoming a guest',
        html: `<p>When someone arrives, greet them warmly with this phrase:</p>`
          + say('babel', 'Babel', 'Ongi etorri', 'OHN-gee eh-TOH-rree', 'Welcome')
          + `<p>You'll see <em>Ongi etorri</em> on signs at borders, doorways, and festivals all across the Basque Country.</p>`
      },
      {
        type: 'question',
        eyebrow: 'Quick check',
        title: 'Which phrase means "See you tomorrow"?',
        options: [
          'A goat solemnly reading the weather forecast',
          'Gero arte',
          'Bihar arte',
          'A thunderstorm trapped inside a toaster'
        ],
        answer: 2,
        explain: `<p><strong>Bihar arte</strong> (BEE-ar AR-teh) is "See you tomorrow." Watch out for <em>Gero arte</em> — that's the near-miss meaning "See you later."</p>`
      },
      {
        type: 'question',
        eyebrow: 'Quick check',
        title: 'You are leaving a shop. Which word means "Goodbye"?',
        options: [
          'Kaixo',
          'Agur',
          'A herd of deeply confused llamas',
          'A sneezing volcano wearing a scarf'
        ],
        answer: 1,
        explain: `<p><strong>Agur</strong> (ah-GOOR) means <strong>Goodbye</strong>. <em>Kaixo</em> is the trap — that's "Hello"!</p>`
      },
      {
        type: 'concept',
        eyebrow: 'RECAP',
        title: 'Your greetings toolkit',
        html: `<p>Superb work! Here's everything you can now say:</p>`
          + `<ul>
              <li><strong>Kaixo</strong> — hello, any time</li>
              <li><strong>Egun on</strong> — good morning</li>
              <li><strong>Arratsalde on</strong> — good afternoon</li>
              <li><strong>Gabon</strong> — good evening / good night</li>
              <li><strong>Agur</strong> — goodbye</li>
              <li><strong>Gero arte</strong> — see you later</li>
              <li><strong>Bihar arte</strong> — see you tomorrow</li>
              <li><strong>Ongi etorri</strong> — welcome</li>
            </ul>`
          + say('edam', 'Edam', 'Agur', 'ah-GOOR', 'Goodbye')
          + `<p>Remember: greetings follow the sun (<em>Egun on</em> &rarr; <em>Arratsalde on</em> &rarr; <em>Gabon</em>), and <em>arte</em> means "until." Gero arte!</p>`
      }
    ];
    renderLesson(document.getElementById('lesson'), STEPS, {
      courseId: 'basque',
      lessonId: 'eu-2',
      backHref: 'index.html',
      courseName: 'Euskara — Basque',
    });
    const VOICE = {
      lingo:{pitch:1.05,rate:0.90,vi:0}, rita:{pitch:1.55,rate:0.95,vi:1}, diego:{pitch:0.80,rate:0.88,vi:2},
      gosia:{pitch:1.35,rate:0.92,vi:3}, james:{pitch:0.68,rate:0.85,vi:4}, sam:{pitch:1.20,rate:0.98,vi:5},
      william:{pitch:0.92,rate:0.87,vi:6}, steve:{pitch:1.70,rate:1.00,vi:7}, babel:{pitch:1.10,rate:0.90,vi:8},
      edam:{pitch:0.60,rate:0.82,vi:9},
    };
    function speak(text, who) {
      try {
        const synth = window.speechSynthesis; if (!synth) return; synth.cancel();
        const prof = VOICE[who] || { pitch: 1, rate: 0.9, vi: 0 };
        const u = new SpeechSynthesisUtterance(text); u.lang = 'eu-ES'; u.pitch = prof.pitch; u.rate = prof.rate;
        const voices = synth.getVoices() || [];
        const pool = voices.filter(x => /^eu\b|^eu[-_]/i.test(x.lang));
        const espool = voices.filter(x => /^es\b|^es[-_]/i.test(x.lang));
        const chosen = pool.length ? pool : espool;
        if (chosen.length) u.voice = chosen[prof.vi % chosen.length];
        synth.speak(u);
      } catch {}
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]'); if (!b) return; e.preventDefault();
      speak(b.getAttribute('data-say'), b.getAttribute('data-voice'));
    });
  </script>
</body>
</html>
