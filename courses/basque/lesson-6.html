<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 6 · Numbers 1 to 10 — Euskara — Basque — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/lesson-engine.css">
  <style>
    .eu-row { display: flex; align-items: center; gap: 14px; margin: 14px 0; text-align: left; }
    .eu-av { width: 62px; height: 62px; flex-shrink: 0; border-radius: 50%; background: #fff;
             padding: 4px; border: 2px solid #7dd3fc; box-shadow: 0 4px 14px rgba(14,165,233,0.22); }
    .eu-bubble { position: relative; flex: 1; background: #f0f9ff; border: 1px solid #bae6fd;
                 border-radius: 14px; padding: 10px 14px; }
    .eu-bubble::before { content: ''; position: absolute; left: -8px; top: 22px; width: 0; height: 0;
                 border: 8px solid transparent; border-right-color: #f0f9ff; border-left: 0; }
    .eu-name { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #0284c7; }
    .eu-eu { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 2px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .eu-pron { font-size: 0.82rem; color: #0ea5e9; font-style: italic; }
    .eu-en { font-size: 0.95rem; color: #475569; }
    .eu-say { border: none; background: #0ea5e9; color: #fff; border-radius: 999px;
              width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; line-height: 1;
              box-shadow: 0 2px 6px rgba(14,165,233,0.35); }
    .eu-say:hover { background: #0284c7; }
    .eu-say:active { transform: scale(0.92); }
  </style>
</head>
<body class="le-body">
  <script type="module" src="../../js/auth-gate.js" data-base="../../"></script>
  <div id="lesson"></div>
  <script type="module">
    import '../../js/nav.js';
    import { renderLesson } from '../../js/lesson-engine.js';
    function say(avatar, name, eu, pron, en) {
      return `<div class="eu-row">
        <img class="eu-av" src="../../assets/characters/${avatar}.svg" alt="${name}">
        <div class="eu-bubble">
          <div class="eu-name">${name}</div>
          <div class="eu-eu">${eu}
            <button class="eu-say" type="button" data-say="${eu.replace(/"/g, '&quot;')}" data-voice="${avatar}" aria-label="Hear ${name} say it">🔊</button>
          </div>
          <div class="eu-pron">${pron}</div>
          <div class="eu-en">${en}</div>
        </div>
      </div>`;
    }
    const STEPS = [ {
      type: 'concept',
      eyebrow: 'Lesson 6 · Numbers',
      title: 'Zenbakiak — Numbers',
      html:
        `<p>In Basque, numbers are called <strong>Zenbakiak</strong>. Basque is one of the oldest languages in Europe, and its numbers sound like nothing else you have heard. Let's count from 1 to 10!</p>`
        + say('lingo', 'Lingo', 'bat', 'baht', 'one (1)')
    },
    {
      type: 'concept',
      eyebrow: 'Counting',
      title: 'From bat to bost (1–5)',
      html:
        say('rita', 'Rita', 'bat', 'baht', 'one (1)')
        + say('diego', 'Diego', 'bi', 'bee', 'two (2)')
        + say('gosia', 'Gosia', 'hiru', 'EE-roo', 'three (3)')
        + say('james', 'James', 'lau', 'lau', 'four (4)')
        + say('sam', 'Sam', 'bost', 'bohst', 'five (5)')
    },
    {
      type: 'concept',
      eyebrow: 'Counting',
      title: 'From sei to hamar (6–10)',
      html:
        say('william', 'William', 'sei', 'say', 'six (6)')
        + say('steve', 'Steve', 'zazpi', 'SAHS-pee', 'seven (7)')
        + say('babel', 'Babel', 'zortzi', 'SOR-tsee', 'eight (8)')
        + say('edam', 'Edam', 'bederatzi', 'beh-deh-RAH-tsee', 'nine (9)')
        + say('lingo', 'Lingo', 'hamar', 'HAH-mar', 'ten (10)')
    },
    {
      type: 'question',
      eyebrow: 'Quick check',
      title: 'What does «hiru» mean?',
      options: [
        'Three (3)',
        'A penguin doing your taxes',
        'Five (5)',
        'Rain falling upward inside a fridge'
      ],
      answer: 0,
      explain: `<p>Yes! <strong>hiru</strong> (EE-roo) means <strong>three (3)</strong>. Five would be <strong>bost</strong>.</p>`
    },
    {
      type: 'question',
      eyebrow: 'Quick check',
      title: 'Which Basque word means five (5)?',
      options: [
        'zortzi',
        'bost',
        'A cat conducting a tiny orchestra',
        'A sandwich that runs marathons'
      ],
      answer: 1,
      explain: `<p>Correct! <strong>bost</strong> (bohst) means <strong>five (5)</strong>. Careful: <strong>zortzi</strong> is eight (8).</p>`
    },
    {
      type: 'concept',
      eyebrow: 'Practice',
      title: 'Count out loud!',
      html:
        `<p>Let's count together from one to five. Tap the 🔊 buttons and repeat after each friend!</p>`
        + say('diego', 'Diego', 'bat, bi, hiru, lau, bost', 'baht, bee, EE-roo, lau, bohst', 'one, two, three, four, five')
        + say('rita', 'Rita', 'sei, zazpi, zortzi, bederatzi, hamar', 'say, SAHS-pee, SOR-tsee, beh-deh-RAH-tsee, HAH-mar', 'six, seven, eight, nine, ten')
        + `<p>Nice work! You just counted all the way to ten in Basque.</p>`
    },
    {
      type: 'question',
      eyebrow: 'Quick check',
      title: 'How do you say ten (10) in Basque?',
      options: [
        'A snail wearing a tiny top hat',
        'hamar',
        'bederatzi',
        'A rainbow stuck in a washing machine'
      ],
      answer: 1,
      explain: `<p>That's it! <strong>hamar</strong> (HAH-mar) means <strong>ten (10)</strong>. Watch out for <strong>bederatzi</strong>, which is nine (9).</p>`
    },
    {
      type: 'concept',
      eyebrow: 'Recap',
      title: 'You can count to ten!',
      html:
        `<p>Great job! Here are all ten numbers in Basque:</p>`
        + `<p><strong>1</strong> bat · <strong>2</strong> bi · <strong>3</strong> hiru · <strong>4</strong> lau · <strong>5</strong> bost<br><strong>6</strong> sei · <strong>7</strong> zazpi · <strong>8</strong> zortzi · <strong>9</strong> bederatzi · <strong>10</strong> hamar</p>`
        + say('gosia', 'Gosia', 'hamar', 'HAH-mar', 'ten (10)')
        + `<p>Practice counting whenever you can. See you in the next lesson!</p>`
    } ];
    renderLesson(document.getElementById('lesson'), STEPS, {
      courseId: 'basque',
      lessonId: 'eu-6',
      backHref: 'index.html',
      courseName: 'Euskara — Basque',
    });
    const VOICE = {
      lingo:{pitch:1.05,rate:0.90,vi:0}, rita:{pitch:1.55,rate:0.95,vi:1}, diego:{pitch:0.80,rate:0.88,vi:2},
      gosia:{pitch:1.35,rate:0.92,vi:3}, james:{pitch:0.68,rate:0.85,vi:4}, sam:{pitch:1.20,rate:0.98,vi:5},
      william:{pitch:0.92,rate:0.87,vi:6}, steve:{pitch:1.70,rate:1.00,vi:7}, babel:{pitch:1.10,rate:0.90,vi:8},
      edam:{pitch:0.60,rate:0.82,vi:9},
    };
    function speak(text, who) {
      try {
        const synth = window.speechSynthesis; if (!synth) return; synth.cancel();
        const prof = VOICE[who] || { pitch: 1, rate: 0.9, vi: 0 };
        const u = new SpeechSynthesisUtterance(text); u.lang = 'eu-ES'; u.pitch = prof.pitch; u.rate = prof.rate;
        const voices = synth.getVoices() || [];
        const pool = voices.filter(x => /^eu\b|^eu[-_]/i.test(x.lang));
        const espool = voices.filter(x => /^es\b|^es[-_]/i.test(x.lang));
        const chosen = pool.length ? pool : espool;
        if (chosen.length) u.voice = chosen[prof.vi % chosen.length];
        synth.speak(u);
      } catch {}
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]'); if (!b) return; e.preventDefault();
      speak(b.getAttribute('data-say'), b.getAttribute('data-voice'));
    });
  </script>
</body>
</html>
