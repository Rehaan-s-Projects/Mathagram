<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 8 · Familia — Family — Euskara — Basque — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/lesson-engine.css">
  <style>
    .eu-row { display: flex; align-items: center; gap: 14px; margin: 14px 0; text-align: left; }
    .eu-av { width: 62px; height: 62px; flex-shrink: 0; border-radius: 50%; background: #fff;
             padding: 4px; border: 2px solid #7dd3fc; box-shadow: 0 4px 14px rgba(14,165,233,0.22); }
    .eu-bubble { position: relative; flex: 1; background: #f0f9ff; border: 1px solid #bae6fd;
                 border-radius: 14px; padding: 10px 14px; }
    .eu-bubble::before { content: ''; position: absolute; left: -8px; top: 22px; width: 0; height: 0;
                 border: 8px solid transparent; border-right-color: #f0f9ff; border-left: 0; }
    .eu-name { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #0284c7; }
    .eu-eu { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin: 2px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .eu-pron { font-size: 0.82rem; color: #0ea5e9; font-style: italic; }
    .eu-en { font-size: 0.95rem; color: #475569; }
    .eu-say { border: none; background: #0ea5e9; color: #fff; border-radius: 999px;
              width: 30px; height: 30px; cursor: pointer; font-size: 0.9rem; line-height: 1;
              box-shadow: 0 2px 6px rgba(14,165,233,0.35); }
    .eu-say:hover { background: #0284c7; }
    .eu-say:active { transform: scale(0.92); }
  </style>
</head>
<body class="le-body">
  <script type="module" src="../../js/auth-gate.js" data-base="../../"></script>
  <div id="lesson"></div>
  <script type="module">
    import '../../js/nav.js';
    import { renderLesson } from '../../js/lesson-engine.js';
    function say(avatar, name, eu, pron, en) {
      return `<div class="eu-row">
        <img class="eu-av" src="../../assets/characters/${avatar}.svg" alt="${name}">
        <div class="eu-bubble">
          <div class="eu-name">${name}</div>
          <div class="eu-eu">${eu}
            <button class="eu-say" type="button" data-say="${eu.replace(/"/g, '&quot;')}" data-voice="${avatar}" aria-label="Hear ${name} say it">🔊</button>
          </div>
          <div class="eu-pron">${pron}</div>
          <div class="eu-en">${en}</div>
        </div>
      </div>`;
    }
    const STEPS = [
      { type:'concept', eyebrow:'Familia', title:'Meet the family', html:
        `<p>In Basque, the word for a <strong>family</strong> is <strong>familia</strong>. Let's meet everyone one by one — tap a speaker to hear each word.</p>` +
        say('lingo','Lingo','familia','fah-MEE-lyah','family') },

      { type:'concept', eyebrow:'Parents', title:'Mother &amp; father', html:
        `<p>Every family album starts with the parents.</p>` +
        say('rita','Rita','ama','AH-mah','mother') +
        say('diego','Diego','aita','EYE-tah','father') },

      { type:'concept', eyebrow:'Grandparents', title:'Grandmother &amp; grandfather', html:
        `<p>Now the grandparents — the wise ones.</p>` +
        say('gosia','Gosia','amona','ah-MOH-nah','grandmother') +
        say('james','James','aitona','eye-TOH-nah','grandfather') },

      { type:'concept', eyebrow:'Children', title:'Son, daughter &amp; child', html:
        `<p>And the little ones in the family.</p>` +
        say('sam','Sam','semea','seh-MEH-ah','son') +
        say('babel','Babel','alaba','ah-LAH-bah','daughter') +
        say('steve','Steve','haurra','HOW-rrah','child') },

      { type:'question', eyebrow:'Quick check', title:'What does "ama" mean?',
        options:['a penguin doing its taxes','father','mother','a cloud sneezing rain'],
        answer:2,
        explain:`<strong>Ama</strong> (AH-mah) means <strong>mother</strong>. Don't mix it up with <strong>aita</strong>, which is father!` },

      { type:'concept', eyebrow:'Fun fact', title:'A word that depends on WHO is speaking', html:
        `<p>Here is a lovely Basque curiosity: the word for a sibling can depend on the <strong>speaker's</strong> gender. A man calls his brother <strong>anaia</strong> (ah-NAH-yah), while a woman calls her brother <strong>neba</strong> (NEH-bah).</p>` +
        say('william','William','anaia','ah-NAH-yah','brother (said by a man)') +
        say('rita','Rita','neba','NEH-bah','brother (said by a woman)') },

      { type:'question', eyebrow:'Quick check', title:'Why might a man and a woman use different words for "brother"?',
        options:[
          'Because the word changes with the weather outside',
          'Because it depends on the brother\'s shoe size',
          'Because the word depends on the SPEAKER\'S gender',
          'Because brothers may only be mentioned on Tuesdays'
        ],
        answer:2,
        explain:`Exactly! A man says <strong>anaia</strong> and a woman says <strong>neba</strong> — the choice depends on who is doing the speaking.` },

      { type:'concept', eyebrow:'Recap', title:'You met the whole familia!', html:
        `<p>Wonderful work! Here is your family album:</p>
         <ul>
           <li><strong>familia</strong> — family</li>
           <li><strong>ama</strong> — mother · <strong>aita</strong> — father</li>
           <li><strong>amona</strong> — grandmother · <strong>aitona</strong> — grandfather</li>
           <li><strong>semea</strong> — son · <strong>alaba</strong> — daughter · <strong>haurra</strong> — child</li>
         </ul>
         <p>And remember the fun quirk: a man says <strong>anaia</strong> and a woman says <strong>neba</strong> for "brother"!</p>` +
        say('lingo','Lingo','familia','fah-MEE-lyah','family') },
    ];
    renderLesson(document.getElementById('lesson'), STEPS, {
      courseId: 'basque',
      lessonId: 'eu-8',
      backHref: 'index.html',
      courseName: 'Euskara — Basque',
    });
    const VOICE = {
      lingo:{pitch:1.05,rate:0.90,vi:0}, rita:{pitch:1.55,rate:0.95,vi:1}, diego:{pitch:0.80,rate:0.88,vi:2},
      gosia:{pitch:1.35,rate:0.92,vi:3}, james:{pitch:0.68,rate:0.85,vi:4}, sam:{pitch:1.20,rate:0.98,vi:5},
      william:{pitch:0.92,rate:0.87,vi:6}, steve:{pitch:1.70,rate:1.00,vi:7}, babel:{pitch:1.10,rate:0.90,vi:8},
      edam:{pitch:0.60,rate:0.82,vi:9},
    };
    function speak(text, who) {
      try {
        const synth = window.speechSynthesis; if (!synth) return; synth.cancel();
        const prof = VOICE[who] || { pitch: 1, rate: 0.9, vi: 0 };
        const u = new SpeechSynthesisUtterance(text); u.lang = 'eu-ES'; u.pitch = prof.pitch; u.rate = prof.rate;
        const voices = synth.getVoices() || [];
        const pool = voices.filter(x => /^eu\b|^eu[-_]/i.test(x.lang));
        const espool = voices.filter(x => /^es\b|^es[-_]/i.test(x.lang));
        const chosen = pool.length ? pool : espool;
        if (chosen.length) u.voice = chosen[prof.vi % chosen.length];
        synth.speak(u);
      } catch {}
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-say]'); if (!b) return; e.preventDefault();
      speak(b.getAttribute('data-say'), b.getAttribute('data-voice'));
    });
  </script>
</body>
</html>
