    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Soap Making</h1>
    <p>Cold-process, hot-process, and melt-and-pour soap crafting — saponification chemistry, oil profiles, lye safety, scent blending, colorants, swirl techniques, and curing. 7 units, 49 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Soap Chemistry Basics",["What Is Saponification?","Lye (Sodium Hydroxide) Safety","Oils & Their SAP Values","Water-to-Lye Ratio","Superfat Explained","Trace & When to Add Scents","Cure Time Science","pH Testing","Common Recipe Failures","Soap Chemistry Checkpoint"]],
      [2,"Cold-Process Method",["Equipment & Mold Prep","Measuring & Mixing Lye","Heating & Combining Oils","Pouring at Trace","Insulating the Mold","Unmolding & Cutting","Curing on Racks","Cold-Process Checkpoint"]],
      [3,"Hot-Process Method",["Crock-Pot Cooking","Stages: Mashed Potato to Vaseline","Pouring HP Soap","Faster Cure Time","HP vs CP Trade-offs","Hot-Process Checkpoint"]],
      [4,"Melt-and-Pour",["Choosing a Base","Coloring Without Bleed","Adding Fragrance","Layering & Embeds","Suspending Inclusions","M&P Checkpoint"]],
      [5,"Scents & Colorants",["Essential Oils","Fragrance Oils","Micas & Pigments","Natural Colorants (Clays, Herbs)","Discoloring Fragrances","Scents Checkpoint"]],
      [6,"Swirl Techniques",["In-the-Pot Swirl","Drop Swirl","Hanger Swirl","Spoon Swirl","Mantra Swirl","Swirl Checkpoint"]],
      [7,"Specialty Soaps",["Castile (100% Olive Oil)","Goat Milk Soap","Activated Charcoal","Shampoo Bars","Beard Wash","Salt Bars","Specialty Soaps Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'soapmaking-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('soap-making');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('soap-making');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
