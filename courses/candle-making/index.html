<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candle Making — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/learning-path.css">
  <style>
    .course-header { padding: 80px 24px 24px; text-align: center; }
    .course-badge { display: inline-block; padding: 4px 14px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; border-radius: 999px; margin-bottom: 12px; }
    .course-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
    .course-header p { font-size: 1rem; color: var(--color-text-secondary); max-width: 620px; margin: 0 auto; line-height: 1.6; }
    @media (max-width: 768px) { .course-header h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Candle Making</h1>
    <p>Soy, beeswax, paraffin, coconut waxes — wick sizing, fragrance load, container vs pillar, troubleshooting tunneling and frosting, and seasonal scent blending. 7 units, 41 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Wax Types",["Soy Wax","Beeswax","Paraffin","Coconut Wax","Palm Wax","Wax Blends","Wax Types Checkpoint"]],
      [2,"Wicks",["Wick Materials","Wick Sizing Charts","Wick Centering","Wood Wicks","Wick Trimming","Wicks Checkpoint"]],
      [3,"Fragrance",["Fragrance Load %","Flash Points","Adding at Correct Temp","Cold vs Hot Throw","Fragrance Checkpoint"]],
      [4,"Container Candles",["Choosing Containers","Pre-Heating Jars","Single Pour","Top-Up Pours","Container Checkpoint"]],
      [5,"Pillar Candles",["Pillar Molds","Releasing the Pillar","Layering Colors","Pillar Burn Tests","Pillar Checkpoint"]],
      [6,"Troubleshooting",["Tunneling","Frosting & Crystals","Sinkholes","Wet Spots","Mushrooming","Cracking","Troubleshooting Checkpoint"]],
      [7,"Specialty Candles",["Soy Tarts & Melts","Container Pillars","Carved Candles","Layered Pour","Seasonal Scents","Specialty Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'candlemaking-'+n, title: t, href: 'quiz.html?unit=' + u + '&lesson=' + (i + 1), unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('candle-making');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('candle-making');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
</body>
</html>
