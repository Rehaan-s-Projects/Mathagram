  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-others)">Others</span>
    <h1>Ice Skating</h1>
    <p>Figure skating and recreational ice skating — edges, swizzles, crossovers, three-turns, spins, basic jumps, and ice etiquette. 7 units, 33 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Skates & Setup",["Figure vs Hockey Skates","Boot Fit","Lacing Properly","Blade Sharpening","Skates Checkpoint"]],
      [2,"First Steps on Ice",["Standing Up","Falling Safely","Marching","Forward Swizzles","First Steps Checkpoint"]],
      [3,"Basic Edges",["Forward Inside Edge","Forward Outside Edge","Back Inside Edge","Back Outside Edge","Edges Checkpoint"]],
      [4,"Crossovers & Turns",["Forward Crossover","Back Crossover","Three-Turn","Mohawk","Turns Checkpoint"]],
      [5,"Stopping",["Snowplow Stop","T-Stop","Hockey Stop","Stopping Checkpoint"]],
      [6,"Spins & Jumps",["Two-Foot Spin","Waltz Jump","Bunny Hop","Salchow (Single)","Spins & Jumps Checkpoint"]],
      [7,"Ice Etiquette",["Traffic Flow","Free Skate vs Lessons","Helmet vs No Helmet","Etiquette Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'iceskating-'+n, title: t, href: '#', unit: u, unitName: name, category: 'others', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('ice-skating');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('ice-skating');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
