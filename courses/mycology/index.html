<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycology — Mathagram</title>
  <link rel="icon" href="../../assets/lighthouse/logo.svg">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/learning-path.css">
  <style>
    .course-header { padding: 80px 24px 24px; text-align: center; }
    .course-badge { display: inline-block; padding: 4px 14px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; border-radius: 999px; margin-bottom: 12px; }
    .course-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
    .course-header p { font-size: 1rem; color: var(--color-text-secondary); max-width: 620px; margin: 0 auto; line-height: 1.6; }
    @media (max-width: 768px) { .course-header h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <nav class="nav"><div class="container"><a href="../../index.html" class="nav-logo"><img src="../../assets/lighthouse/logo.svg" alt="" width="32" height="32"><span>Mathagram</span></a><div class="nav-links"><a href="../../courses.html">Courses</a><a href="../../learning-post.html">Posts</a><a href="../../login.html" data-auth="login">Login</a></div></div></nav>
  <header class="course-header">
    <span class="course-badge" style="background:var(--color-science)">Science</span>
    <h1>Mycology</h1>
    <p>Scientific study of fungi — taxonomy, life cycles, mycorrhizae, fermentation, medicinal mushrooms, lichens, and citizen science. 7 units, 35 lessons.</p>
  </header>
  <div id="learning-path" class="path-container"></div>
  <footer class="footer"><div class="container"><p class="footer-copy">&copy; <span id="year"></span> Mathagram.org — All Rights Reserved.</p></div></footer>
  <script type="module">
    import { initNav } from '../../js/nav.js';
    initNav('../../');
    import { renderPath, getCompletedLessons } from '../../js/learning-path.js';
    import { onAuthChange } from '../../js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();
    const units = [
      [1,"Fungal Kingdom",["Why Fungi Aren't Plants","Hyphae & Mycelium","Cell Walls (Chitin)","Major Phyla","Kingdom Checkpoint"]],
      [2,"Life Cycle",["Spore Germination","Mycelial Network","Fruiting Body Formation","Spore Dispersal","Life Cycle Checkpoint"]],
      [3,"Identification",["Cap, Gills, Stem","Spore Color","Habitat Clues","Chemical Tests (KOH, Iron Salt)","ID Checkpoint"]],
      [4,"Mycorrhizae",["Ectomycorrhizal","Endomycorrhizal (AMF)","Plant-Fungal Networks","Forest Webs","Mycorrhizae Checkpoint"]],
      [5,"Fermentation",["Saccharomyces (Beer, Bread)","Aspergillus (Sake, Soy Sauce)","Penicillium (Cheeses)","Fermentation Checkpoint"]],
      [6,"Medicinal Fungi",["Reishi","Lion's Mane","Cordyceps","Turkey Tail","Psilocybin Research","Medicinal Checkpoint"]],
      [7,"Lichens & Citizen Science",["Symbiosis: Fungus + Alga","Crustose, Foliose, Fruticose","Lichen Bioindicators","iNaturalist Data","Citizen Checkpoint"]]
    ];
    let n = 0;
    const lessons = [];
    units.forEach(([u, name, titles]) => {
      titles.forEach((t, i) => {
        n++;
        lessons.push({ id: 'mycology-'+n, title: t, href: '#', unit: u, unitName: name, category: 'science', checkpoint: i===titles.length-1 });
      });
    });
    async function loadPath() {
      const container = document.getElementById('learning-path');
      let completed = await getCompletedLessons('mycology');
      renderPath(container, lessons, completed);
      onAuthChange(async (user) => {
        completed = await getCompletedLessons('mycology');
        renderPath(container, lessons, completed);
      });
    }
    loadPath();
  </script>
</body>
</html>
